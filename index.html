<!DOCTYPE html>
<html lang="vi">
<head>

<style>
:root{--bg:#0a0618;--panel:#171031;--ink:#f1eaff;--mute:#a99bd6;--acc:#9dff6a;--acc2:#c06bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0a0618}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
h1{margin:0 0 4px;font-size:clamp(26px,6vw,40px);background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 14px;color:var(--mute)}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #000a}
canvas{display:block;width:100%}
#res{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,3,16,.6);backdrop-filter:blur(4px)}
.card{text-align:center;padding:24px 30px;border-radius:20px;background:var(--panel);border:1px solid #9dff6a55;box-shadow:0 0 50px #9dff6a33;animation:pop .5s cubic-bezier(.2,1.6,.4,1);max-width:90%}
.card .e{font-size:56px}.card p{margin:6px 0;color:var(--mute)}
.card h2{margin:6px 0 14px;font-size:clamp(28px,8vw,54px);word-break:break-word;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.panel{margin-top:14px;background:var(--panel);border-radius:18px;padding:16px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
textarea{width:100%;background:#0a0618;color:var(--ink);border:1px solid #3a2b70;border-radius:12px;padding:10px;font:inherit;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;color:#102506;background:linear-gradient(90deg,var(--acc),#d4ff7c)}
button.ghost{background:#2a2060;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}
#go{font-size:18px;flex:1 1 200px}#hint{color:var(--mute);margin:10px 0 0;min-height:1.2em}
ol{margin:8px 0 0;padding-left:22px;max-height:160px;overflow:auto}
#sec{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,2,12,.78);backdrop-filter:blur(3px)}
.sbox{width:min(580px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid #3a2b70;border-radius:16px;padding:14px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.srow{display:grid;grid-template-columns:1fr 110px 58px 52px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #2a2060;font-size:14px}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow input[type=number]{width:100%;background:#0a0618;color:var(--ink);border:1px solid #3a2b70;border-radius:6px;padding:4px}.srow .pc{color:var(--acc);text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧙‍♀️ Phù Thủy Biến Hình</h1>
  <p class="sub">Bà phù thủy khuấy nồi thuốc, rọi phép thuật qua đám đông rồi biến người xui xẻo thành ếch, mèo hoặc viên kẹo. Di chuột lên đám đông để xem tên.</p>
  <div class="stage"><canvas id="cv"></canvas>
    <div id="res" hidden><div class="card"><div class="e" id="em">🐸</div><p id="q"></p><h2 id="who"></h2><button id="ok">Tiếp tục</button></div></div>
  </div>
  <div class="panel">
    <div class="row"><button id="go">🔮 Niệm chú!</button><button id="rst" class="ghost">Hóa phép trả lại</button></div>
    <div class="row" style="margin-top:10px;align-items:center"><label style="margin:0">Số người bị chọn mỗi lần <input id="cnt" type="number" min="1" max="10" value="1" style="width:60px;background:#0a0618;color:var(--ink);border:1px solid #3a2b70;border-radius:8px;padding:6px"></label><label class="chk" style="margin:0"><input type="checkbox" id="snd" checked> Âm thanh</label><label style="margin:0">Thời gian chọn: <b id="dv">12</b> giây <input id="dur" type="range" min="5" max="40" value="12" style="vertical-align:middle;width:140px"></label></div>
    <p id="hint"></p>
    <label for="names" style="margin-top:12px">Danh sách (mỗi dòng một tên, dán từ Excel được, tối đa 300)</label>
    <textarea id="names" rows="6"></textarea>
    <label class="chk"><input type="checkbox" id="rm" checked> Người bị biến hình sẽ rời khỏi danh sách</label>
    <div id="histbox" hidden><label>Đã bị biến hình:</label><ol id="hist"></ol></div>
  </div>
</div>
<div id="sec" hidden><div class="sbox"><div class="shead"><b>🌙 Bảng may rủi</b><button id="sx" class="ghost" style="padding:6px 14px">Đóng</button></div>
<div class="row" style="margin-bottom:8px"><input id="sf" placeholder="Tìm tên..." style="flex:1;background:#0a0618;color:var(--ink);border:1px solid #3a2b70;border-radius:8px;padding:8px"><button id="sr" class="ghost" style="padding:8px 12px">Đặt lại = 1</button></div>
<div id="sl"></div></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const E=(c,col,x,y,a,b,r=0)=>{c.fillStyle=col;c.beginPath();c.ellipse(x,y,a,b,r,0,7);c.fill()};
const SK=['#f7d9bf','#ecc19a','#d19a6f','#a86b45','#6e4429'],HC=['#16110d','#3a2414','#6a3d1d','#a8692b','#d9b45e','#9a9aa3','#a8321f','#2f4fa8'];
const SH=['#e24d5a','#3f8ae0','#f2b83c','#46b97a','#9a5fd1','#f07fb0','#e8e8ee','#ef7d3a','#2fb6c4'],PA=['#2b3a67','#3a3a44','#6b4a2f','#1f5a52','#55406b'];
function mkPerson(seed){
  const r=rng(seed*7919+13),pk=a=>a[Math.floor(r()*a.length)];
  const c=document.createElement('canvas');c.width=80;c.height=160;const g=c.getContext('2d');
  const sk=pk(SK),hc=pk(HC),sh=pk(SH),pa=pk(PA),dress=r()<.5&&r()<.9,st=Math.floor(r()*5);
  const F=(col,x0=10,x1=70)=>{g.fillStyle=col;g.fill();const q=g.createLinearGradient(x0,0,x1,0);q.addColorStop(0,'rgba(0,0,0,.3)');q.addColorStop(.4,'rgba(255,255,255,.1)');q.addColorStop(1,'rgba(0,0,0,.32)');g.fillStyle=q;g.fill();g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1.2;g.stroke()};
  const ln=(w,col,x1,y1,x2,y2)=>{g.lineCap='round';g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
  E(g,'rgba(0,0,0,.3)',40,154,24,5);
  if(st==2){g.beginPath();g.moveTo(22,30);g.quadraticCurveTo(17,70,24,90);g.lineTo(56,90);g.quadraticCurveTo(63,70,58,30);g.closePath();F(hc)}
  if(st==3){g.beginPath();g.arc(40,30,25,0,7);F(hc)}
  if(dress)[29,43].forEach(a=>{g.beginPath();g.rect(a,112,8,36);F(sk,a,a+8)});
  else[29,41].forEach(a=>{g.beginPath();g.rect(a,100,10,46);F(pa,a,a+10)});
  E(g,'#1d1a22',34,150,8,4.5);E(g,'#1d1a22',46,150,8,4.5);
  [-1,1].forEach(s=>{ln(11,'rgba(0,0,0,.3)',40+s*16,64,40+s*21,86);ln(9,sh,40+s*16,64,40+s*21,86);ln(7.5,sk,40+s*21,86,40+s*22,102);E(g,sk,40+s*22,104,4.5,4.5)});
  g.beginPath();
  if(dress){g.moveTo(26,58);g.lineTo(54,58);g.quadraticCurveTo(58,90,68,124);g.lineTo(12,124);g.quadraticCurveTo(22,90,26,58)}
  else{g.moveTo(25,58);g.quadraticCurveTo(40,52,55,58);g.lineTo(57,106);g.lineTo(23,106)}
  g.closePath();F(sh);
  g.fillStyle=sk;g.beginPath();g.moveTo(35,57);g.lineTo(45,57);g.lineTo(40,67);g.fill();g.fillRect(35,46,10,12);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(35,50,10,6);
  E(g,sk,24,36,3.5,4.5);E(g,sk,56,36,3.5,4.5);
  const q=g.createRadialGradient(34,28,2,40,34,24);q.addColorStop(0,'rgba(255,255,255,.25)');q.addColorStop(1,'rgba(0,0,0,.22)');
  E(g,sk,40,34,16,18);E(g,q,40,34,16,18);
  E(g,'#2a1b16',33,36,2.2,2.9);E(g,'#2a1b16',47,36,2.2,2.9);E(g,'#fff',33.8,35,.8,.8);E(g,'#fff',47.8,35,.8,.8);
  g.strokeStyle=hc;g.lineWidth=2;g.beginPath();g.moveTo(29,30);g.lineTo(36,29);g.moveTo(44,29);g.lineTo(51,30);g.stroke();
  g.strokeStyle='#9a3d3d';g.lineWidth=1.8;g.beginPath();g.arc(40,41,6,.25,Math.PI-.25);g.stroke();
  E(g,'rgba(255,110,110,.22)',29,42,4,3);E(g,'rgba(255,110,110,.22)',51,42,4,3);
  if(r()<.2){g.strokeStyle='#222';g.lineWidth=1.4;g.beginPath();g.arc(33,36,5.5,0,7);g.moveTo(52.5,36);g.arc(47,36,5.5,0,7);g.moveTo(38.5,36);g.lineTo(41.5,36);g.stroke()}
  g.beginPath();
  if(st==4){g.moveTo(22,28);g.quadraticCurveTo(24,8,40,8);g.quadraticCurveTo(56,8,58,28);g.closePath();F(sh);E(g,'rgba(0,0,0,.35)',47,28,17,4)}
  else{if(st==1){g.moveTo(21,36);g.quadraticCurveTo(19,8,42,9);g.quadraticCurveTo(60,10,59,34);g.quadraticCurveTo(52,18,30,26);g.quadraticCurveTo(26,28,21,36)}
  else{g.moveTo(21,34);g.quadraticCurveTo(21,10,40,10);g.quadraticCurveTo(59,10,59,34);g.quadraticCurveTo(54,22,40,22);g.quadraticCurveTo(26,22,21,34)}
  g.closePath();F(hc)}
  return c;
}
const SP=Array.from({length:40},(_,i)=>mkPerson(i+1));
let W=700,H=600,dpr=1,PH=60,people=[],bg,stars=[],flies=[],hist=[],job=null,last=null,castK=0,B=.25,LH=150,mouse=null,tip={x:0,y:0};
let L={wx:0,wy:0,s:1,px:0,lx:0,ly:0};
const ps=[];
let WT={};try{WT=JSON.parse(localStorage.getItem('witch-w')||'{}')}catch(e){}
function pickWin(a,n){const r=wpick(a,n);if(r.length<n)r.push(...shuffle(a.filter(p=>!r.includes(p))).slice(0,n-r.length));return r}
let SPD=1;let AC=null;const EMO=['🐸','🐱','🍬'];let lastRes=[];
function tone(f,d,ty='sine',v=.12,f2){if(!AC||!$('snd').checked)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const mxOf=p=>Math.max(1,Math.min(2.6,(p.y-8)/(PH*p.sc)));
function wpick(list,k){const pool=list.filter(p=>p.w>0),out=[];while(out.length<k&&pool.length){const tot=pool.reduce((s,p)=>s+p.w,0);let r=rnd(1e9)/1e9*tot,i=0;for(;i<pool.length-1&&r>=pool[i].w;i++)r-=pool[i].w;out.push(pool.splice(i,1)[0])}return out}
function oddsOf(p){const t=people.filter(q=>!q.gone).reduce((s,q)=>s+q.w,0);return (t?p.w/t*100:0).toFixed(1)+'%'}
function renderOdds(){$('odds').innerHTML='';people.filter(p=>!p.gone).forEach(p=>{const li=document.createElement('li');li.textContent=p.name+' — '+oddsOf(p)+(p.w!==1?'  (×'+p.w+')':'');$('odds').appendChild(li)})}
function nextWin(){const j=job;j.res.push({p:j.fin,k:j.kind});
  if(j.wi>=j.fins.length-1){finish();return}
  const h=head(j.fin);burst(h.x,h.y,25);j.wi++;j.fin=j.fins[j.wi];j.kind=rnd(3);
  const ds=shuffle(people.filter(q=>!q.gone&&!q.hid&&q!==j.fin)).slice(0,2);j.seq=[...ds,j.fin];j.i=0;j.spot=0;j.g=0;j.flash=0;j.mx=mxOf(j.fin);
  j.ph='fly';j.t=0;j.from={x:tip.x,y:tip.y};j.to=head(j.seq[0]);tone(300,.6,'sine',.07,1000)}
const head=p=>({x:p.x,y:p.y-PH*p.sc*.75});
function smoke(x,y,h,o={}){ps.push({x,y,vx:(Math.random()-.5)*22,vy:-30-Math.random()*34,r:6+Math.random()*8,l:0,m:1.4+Math.random(),h,k:0,...o})}
function spark(x,y,h,v){const a=Math.random()*6.283,s=30+Math.random()*v;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*2.2,l:0,m:.6+Math.random()*.7,h,k:1})}
const burst=(x,y,n)=>{for(let i=0;i<n;i++){smoke(x,y,90+rnd(210),{vx:(Math.random()-.5)*160,vy:(Math.random()-.8)*120,r:8+Math.random()*12});spark(x,y,60+rnd(240),170)}};
const parse=()=>$('names').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,300);
try{$('names').value=localStorage.getItem('witch-names')||''}catch(e){}
if(!$('names').value)$('names').value='An\nBình\nChi\nDũng\nEm\nPhúc\nGiang\nHà\nKhoa\nLan\nMinh\nNga\nOanh\nPhong\nQuân\nRin\nSơn\nThảo\nUyên\nVân';
function build(){people=parse().map((nm,i)=>{return{name:nm,w:(nm in WT)?WT[nm]:1,id:i,v:(i*17+rnd(3))%40,gone:false,hid:false,fear:0,x:0,y:0,sc:1}});hist=[];renderHist();fit()}
function fit(){
  dpr=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth||700;
  const n=people.length||1;let ph=130,cols,rows,bh;
  for(;ph>24;ph-=3){cols=Math.max(1,Math.floor((W-20)/(ph*.52)));rows=Math.ceil(n/cols);bh=rows*ph*.34+ph*.66;if(bh<=300)break}
  PH=ph;H=Math.round(100+bh+250);cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  people.forEach((p,k)=>{const r=Math.floor(k/cols),c=k%cols,inRow=Math.min(cols,n-r*cols),sx=Math.min(ph*.62,(W-20)/inRow),x0=(W-(inRow-1)*sx)/2;
    p.x=x0+c*sx+(r%2)*sx*.2+((k*37)%7-3);p.y=104+ph*.66+r*ph*.34+((k*53)%5);p.sc=.88+.12*(rows>1?r/(rows-1):1)});
  const s=Math.max(.62,Math.min(1.15,W/760));L={s,wx:W*.38,wy:H-34,px:W*.38+100*s};L.lx=L.px;L.ly=L.wy-52*s;
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*95,r:Math.random()*1.3+.3,p:Math.random()*6}));
  flies=Array.from({length:22},()=>({x:Math.random()*W,y:110+Math.random()*(H-130),p:Math.random()*9}));
  bg=document.createElement('canvas');bg.width=W*dpr;bg.height=H*dpr;const b=bg.getContext('2d');b.scale(dpr,dpr);
  let g=b.createLinearGradient(0,0,0,110);g.addColorStop(0,'#05020f');g.addColorStop(1,'#2b1646');b.fillStyle=g;b.fillRect(0,0,W,H);
  const mx=W*.82;g=b.createRadialGradient(mx,62,10,mx,62,110);g.addColorStop(0,'rgba(255,244,200,.55)');g.addColorStop(1,'rgba(255,244,200,0)');b.fillStyle=g;b.fillRect(mx-110,0,220,170);
  E(b,'#fff3c4',mx,62,32,32);[[-10,-8,7],[8,6,9],[-4,12,5]].forEach(([a,c,r])=>E(b,'rgba(200,180,120,.35)',mx+a,62+c,r,r));
  [['#1a0e33',0],['#0b0620',1]].forEach(([col,Ly])=>{b.fillStyle=col;for(let x=-10;x<W+20;x+=15+Ly*7){const h=40+((x*37+Ly*91)%47);b.beginPath();b.moveTo(x-14,110);b.lineTo(x,110-h);b.lineTo(x+14,110);b.fill();b.beginPath();b.moveTo(x-10,110-h*.5);b.lineTo(x,110-h*1.2);b.lineTo(x+10,110-h*.5);b.fill()}});
  g=b.createLinearGradient(0,106,0,H);g.addColorStop(0,'#1f4a3d');g.addColorStop(1,'#08171a');b.fillStyle=g;b.fillRect(0,106,W,H-106);
  g=b.createRadialGradient(W/2,100+bh/2,10,W/2,100+bh/2,W*.6);g.addColorStop(0,'rgba(140,255,170,.12)');g.addColorStop(1,'rgba(140,255,170,0)');b.fillStyle=g;b.fillRect(0,106,W,H);
  g=b.createLinearGradient(0,92,0,140);g.addColorStop(0,'rgba(170,130,255,0)');g.addColorStop(.5,'rgba(170,130,255,.2)');g.addColorStop(1,'rgba(170,130,255,0)');b.fillStyle=g;b.fillRect(0,92,W,48);
}
function renderHist(){$('hist').innerHTML='';hist.forEach(h=>{const li=document.createElement('li');li.textContent=h;$('hist').appendChild(li)});$('histbox').hidden=!hist.length;$('hint').textContent='Còn '+people.filter(p=>!p.gone).length+' người trong đám đông.'}

function dp(p,t,sc2=1,ox=0,halo=0){
  const h=PH*p.sc*sc2;let y=p.y+(sc2>1?0:Math.sin(t*1.6+p.id*1.3));const x=p.x+ox;
  if(p.fear>0)y-=Math.abs(Math.sin(p.fear*12))*10*p.fear;
  if(p.fear>0||halo)E(cx,`rgba(${halo?'190,120,255':'150,255,120'},${.35*(halo||p.fear)})`,x,y-h*.5,h*.34,h*.55);
  cx.drawImage(SP[p.v],x-h/4,y-h,h/2,h);
  if(p.fear>.3){const bx=x,by=y-h-8;E(cx,'#fff',bx,by,6,6);cx.fillStyle='#d11';cx.font='bold 10px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('!',bx,by+.5)}
}
function frog(x,y,h){
  const c=cx;c.save();c.translate(x,y);c.scale(h,h);
  E(c,'#3fa83a',-.3,-.12,.17,.12,.5);E(c,'#3fa83a',.3,-.12,.17,.12,-.5);
  let g=c.createRadialGradient(-.1,-.5,.05,0,-.35,.5);g.addColorStop(0,'#8ff06a');g.addColorStop(1,'#3a9d35');E(c,g,0,-.33,.38,.3);
  E(c,'#d9f7a6',0,-.25,.24,.17);
  [[-.2,-.5,.04],[.18,-.55,.05],[.05,-.6,.03]].forEach(([a,b,r])=>E(c,'#2f8a2e',a,b,r,r));
  [-1,1].forEach(s=>{E(c,'#7be05a',s*.18,-.58,.11,.11);E(c,'#fff',s*.18,-.59,.08,.08);E(c,'#111',s*.19,-.58,.04,.04)});
  c.strokeStyle='#1f5a1e';c.lineWidth=.025;c.lineCap='round';c.beginPath();c.arc(0,-.38,.17,.2,2.94);c.stroke();
  E(c,'#5cc04a',-.16,-.04,.1,.04);E(c,'#5cc04a',.16,-.04,.1,.04);c.restore();

cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();if(!job&&Math.hypot(e.clientX-r.left-W*.82,e.clientY-r.top-62)<38)openSec()});

build();requestAnimationFrame(tick);
